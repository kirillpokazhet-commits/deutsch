<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch A1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--surf:#fff;--ink:#14213d;--mute:#5b6783;--red:#d52b1e;--blue:#2f6db0;--ok:#1f8a4c;--line:#d5dbe6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--surf:#1a2232;--ink:#eef1f7;--mute:#9aa6bf;--red:#ff5a4d;--blue:#6aa6e8;--ok:#4cc27f;--line:#2c3750;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:34px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.de{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0}
.ex{color:var(--mute);margin-top:10px}
.joke{border-left:4px solid var(--red);padding-left:12px;color:var(--mute);margin:12px 0 0}
table{border-collapse:collapse;margin:8px 0}td{padding:4px 18px 4px 0}td:first-child{color:var(--mute)}
b.k{color:var(--red)}
button{font-family:inherit}
.b{font:600 16px inherit;font-family:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%;text-align:left;margin-top:8px}
.b:focus-visible,.seg button:focus-visible,.say:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.main{background:var(--red);border-color:var(--red);color:#fff;text-align:center}
.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surf))}
.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--surf))}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row .b{text-align:center;padding:12px 4px;font-size:14px}
.say{border:0;background:none;font-size:22px;cursor:pointer;color:var(--blue);padding:0 6px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.back{border:0;background:none;color:var(--blue);font:600 16px inherit;font-family:inherit;padding:8px 0;cursor:pointer}
.seg{display:flex;gap:6px;margin:10px 0 16px}.seg button{flex:1;border:1px solid var(--line);background:var(--surf);color:var(--mute);border-radius:10px;padding:10px 4px;font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.l{display:flex;justify-content:space-between;align-items:center;gap:8px}.l small{color:var(--mute);display:block;font-weight:400;font-size:14px}
.w{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.w:last-child{border:0}.w span{color:var(--mute);margin-left:12px;text-align:right}
</style>
</head>
<body>
<main id="app"></main>
<script>
const tb=r=>'<table>'+r.map(x=>'<tr>'+x.map((c,i)=>`<td>${i?'<b class="k">'+c+'</b>':c}</td>`).join('')+'</tr>').join('')+'</table>';
const box=(h,b,j)=>`<div class="box"><h2>${h}</h2>${b}${j?`<p class="joke">${j}</p>`:''}</div>`;
const L=[
{t:"Знакомство",w:`Hallo|привет
Guten Tag|добрый день
Guten Morgen|доброе утро
Guten Abend|добрый вечер
Grüezi|здравствуйте (швейц.)
Tschüss|пока
Auf Wiedersehen|до свидания
Freut mich|приятно познакомиться`,
th:box("heißen и sein","<p>Имя: <b>Ich heiße Ivan.</b> Состояние: <b>Ich bin müde.</b></p>"+tb([["ich","heiße","bin"],["du","heißt","bist"],["er/sie","heißt","ist"],["wir","heißen","sind"],["ihr","heißt","seid"],["sie/Sie","heißen","sind"]]),"Ich bin müde — универсальная фраза для понедельника."),
g:[["Ich ___ Anna.","heiße",["heiße","heißt","heißen"]],["Wie ___ Sie?","heißen",["heißen","heiße","heißt"]],["Ich ___ müde.","bin",["bin","bist","ist"]]]},
{t:"Откуда ты, где живёшь",w:`Woher kommen Sie?|откуда вы?
Ich komme aus …|я родом из …
Ich wohne in …|я живу в …
Ich spreche …|я говорю на …
Deutsch|немецкий
Russisch|русский
die Schweiz|Швейцария
Russland|Россия`,
th:box("Правильные глаголы","<p>Основа + окончание: <b>komm-en → ich komme</b>.</p>"+tb([["ich","komme"],["du","kommst"],["er/sie","kommt"],["wir","kommen"],["ihr","kommt"],["sie/Sie","kommen"]])+"<p>Вопрос с W-словом: глагол всё равно вторым. <b>Woher kommst du?</b></p>","Глагол на втором месте — как гость на свадьбе: сидит и не спорит."),
g:[["Ich ___ aus Russland.","komme",["komme","kommst","kommen"]],["Du ___ in Uznach.","wohnst",["wohnst","wohne","wohnt"]],["Woher ___ du?","kommst",["kommst","komme","kommt"]]]},
{t:"Предметы и артикли",w:`der Tisch|стол
die Lampe|лампа
das Bett|кровать
der Stuhl|стул
die Tür|дверь
das Fenster|окно
der Schrank|шкаф
das Sofa|диван`,
th:box("der, die, das","<p><b class='k'>der</b> — он, <b class='k'>die</b> — она, <b class='k'>das</b> — оно. Неопределённый: <b>ein Tisch, eine Lampe, ein Bett</b>.</p><p>Артикль угадать нельзя, поэтому учи слово сразу с ним.</p>","Der Löffel, die Gabel, das Messer — логики нет, но есть традиция."),
g:[["___ Tisch ist groß.","Der",["Der","Die","Das"]],["___ Lampe ist neu.","Die",["Die","Der","Das"]],["Das ist ___ Bett.","ein",["ein","eine","einen"]]]},
{t:"Еда и покупки",w:`das Brot|хлеб
die Milch|молоко
der Kaffee|кофе
das Wasser|вода
der Käse|сыр
der Apfel|яблоко
der Franken|франк
Was kostet das?|сколько это стоит?`,
th:box("Ich möchte …","<p>Вежливо заказать: <b>Ich möchte einen Kaffee.</b></p><p>У слов мужского рода <b>ein → einen</b> (der Kaffee → einen Kaffee). Женский и средний не меняются: <b>eine Milch, ein Brot</b>.</p>","В Швейцарии вас всё равно спросят: «Mit Milch?» Будьте готовы."),
g:[["Ich ___ einen Kaffee.","möchte",["möchte","möchtest","möchten"]],["Ich möchte ___ Apfel.","einen",["einen","eine","ein"]],["Was ___ das?","kostet",["kostet","kosten","kostest"]]]},
{t:"Время и дни недели",w:`Montag|понедельник
Dienstag|вторник
Mittwoch|среда
Donnerstag|четверг
Freitag|пятница
Samstag|суббота
Sonntag|воскресенье
Wie spät ist es?|который час?`,
th:box("Когда?","<p>День: <b>am Montag</b>. Время: <b>um acht Uhr</b>. Который час: <b>Wie spät ist es? — Es ist acht Uhr.</b></p>","Sonntag в Швейцарии — день тишины: магазины закрыты, стиральную машину лучше не включать."),
g:[["Wie ___ ist es?","spät",["spät","viel","alt"]],["Ich habe ___ Montag Deutschkurs.","am",["am","um","im"]],["Es ist acht ___.","Uhr",["Uhr","Tag","Zeit"]]]},
{t:"Распорядок дня",w:`aufstehen|вставать
frühstücken|завтракать
arbeiten|работать
einkaufen|ходить за покупками
kochen|готовить
lernen|учить
fernsehen|смотреть телевизор
schlafen|спать`,
th:box("Глаголы с отделяемой приставкой","<p>Приставка уходит в конец предложения: <b>aufstehen → Ich stehe um 7 Uhr auf.</b> <b>einkaufen → Wir kaufen heute ein.</b></p>","Приставка в конце — как последний вагон: всё равно приедет."),
g:[["Ich stehe um 7 Uhr ___.","auf",["auf","ein","an"]],["Wir kaufen heute ___.","ein",["ein","auf","an"]],["Ich ___ jeden Tag Deutsch.","lerne",["lerne","lernst","lernt"]]]},
{t:"Семья",w:`die Familie|семья
die Mutter|мать
der Vater|отец
die Schwester|сестра
der Bruder|брат
das Kind|ребёнок
die Eltern|родители
meine / mein|моя / мой`,
th:box("mein и meine","<p>Мужской и средний род: <b>mein Bruder, mein Kind</b>. Женский и множественное: <b>meine Mutter, meine Eltern</b>.</p><p>Так же работают <b>dein / deine</b> («твой / твоя»).</p>","Meine Eltern sind immer pünktlich — это понятно и без перевода."),
g:[["Das ist ___ Mutter.","meine",["meine","mein","meinen"]],["Das ist ___ Bruder.","mein",["mein","meine","meinen"]],["Das sind ___ Eltern.","meine",["meine","mein","meinem"]]]}
];
const ALL={};L.forEach((x,l)=>x.W=x.w.split('\n').map((s,i)=>{const[de,ru]=s.split('|');const o={id:l*20+i,de,ru};ALL[o.id]=o;return o}));
const $=s=>document.querySelector(s),app=$('#app'),day=864e5;
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S={};try{S=JSON.parse(localStorage.getItem('de-a1')||'{}')}catch(e){}S.c=S.c||{};S.q=S.q||{};
const save=()=>{try{localStorage.setItem('de-a1',JSON.stringify(S))}catch(e){}};
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/…/g,''));u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let V={l:null,s:'t'},q=[],shown=false,Q=[],n=0,sc=0,qk='';
const learned=l=>L[l].W.filter(w=>S.c[w.id]&&S.c[w.id].i>=3).length;
const best=k=>S.q[k]!=null?S.q[k]:'—';
const poolW=ls=>ls.flatMap(l=>L[l].W);

function render(){V.l===null?home():page();scrollTo(0,0)}
function go(l,s){V={l,s};render()}
function home(){
 app.innerHTML=`<h1>Deutsch A1.1</h1><p class="sub">Schritte plus · 7 лекций и итоговый тест</p>`+
 L.map((x,l)=>`<button class="b" onclick="go(${l},'t')"><span class="l"><span>Lektion ${l+1}. ${x.t}<small>Слов выучено: ${learned(l)} из ${x.W.length} · тренировка: ${best('l'+l)}/10</small></span><span>›</span></span></button>`).join('')+
 `<button class="b main" style="margin-top:16px" onclick="go('S','w')">Итог: все слова и тест A1.1<br><small>Лучший результат теста: ${best('test')}/20</small></button>`}
function page(){
 const S_=V.l==='S',subs=S_?[['w','Слова'],['q','Тренировки'],['t','Тест A1.1']]:[['t','Теория'],['w','Слова'],['q','Тренировка']];
 app.innerHTML=`<button class="back" onclick="go(null)">‹ Главная</button><h1>${S_?'Итог A1.1':'Lektion '+(V.l+1)}</h1><p class="sub">${S_?'Всё вместе':L[V.l].t}</p>
 <div class="seg">${subs.map(([k,t])=>`<button class="${V.s===k?'on':''}" onclick="go(V.l,'${k}')">${t}</button>`).join('')}</div><div id="body"></div>`;
 const B=$('#body'),ls=S_?L.map((_,i)=>i):[V.l];
 if(!S_&&V.s==='t')B.innerHTML=L[V.l].th;
 else if(V.s==='w')wordsV(B,ls);
 else if(S_&&V.s==='q')B.innerHTML=L.map((x,l)=>`<button class="b" onclick="quiz('l${l}',[${l}],10)">Lektion ${l+1}. ${x.t}<small style="color:var(--mute)"> · ${best('l'+l)}/10</small></button>`).join('');
 else B.innerHTML=S_?`<div class="box"><h2>Тест всего уровня</h2><p class="sub">20 вопросов из всех лекций. Лучший результат: ${best('test')}/20.</p></div><button class="b main" onclick="quiz('test',[0,1,2,3,4,5,6],20)">Начать тест</button>`
 :`<div class="box"><h2>Тренировка</h2><p class="sub">10 вопросов по этой лекции. Лучший результат: ${best('l'+V.l)}/10.</p></div><button class="b main" onclick="quiz('l${V.l}',[${V.l}],10)">Начать</button>`}

function wordsV(B,ls){
 const due=poolW(ls).filter(w=>!S.c[w.id]||S.c[w.id].d<=Date.now()).length;
 B.innerHTML=`<button class="b main" style="margin:0 0 14px" ${due?'':'disabled'} onclick="startCards([${ls}])">${due?'Повторять слова ('+due+')':'На сегодня всё повторено'}</button>`+
 ls.map(l=>`<div class="box">${ls.length>1?`<h2>Lektion ${l+1}</h2>`:''}${L[l].W.map(w=>`<div class="w"><b>${w.de}<button class="say" aria-label="Озвучить" onclick="say(ALL[${w.id}].de)">🔊</button></b><span>${w.ru}</span></div>`).join('')}</div>`).join('')}
function startCards(ls){const d=poolW(ls).filter(w=>!S.c[w.id]||S.c[w.id].d<=Date.now());q=sh(d).slice(0,12).map(w=>w.id);shown=false;card()}
function card(){
 const B=$('#body');
 if(!q.length){B.innerHTML=`<div class="box"><h2>Готово</h2><p class="sub">Эти слова вернутся по графику.</p></div><button class="b main" onclick="render()">К словам</button>`;return}
 const w=ALL[q[0]];
 B.innerHTML=`<div class="meta"><span>Осталось: ${q.length}</span></div><div class="box"><p class="de">${w.de}<button class="say" aria-label="Озвучить" onclick="say(ALL[${w.id}].de)">🔊</button></p>${shown?`<p class="de" style="font-size:22px;margin-top:12px;color:var(--blue)">${w.ru}</p>`:''}</div>`+
 (shown?`<div class="row"><button class="b" onclick="rate(0)">Снова</button><button class="b" onclick="rate(1)">Трудно</button><button class="b" onclick="rate(2)">Хорошо</button><button class="b" onclick="rate(3)">Легко</button></div>`:`<button class="b main" onclick="shown=true;card()">Показать ответ</button>`)}
function rate(r){
 const id=q.shift(),c=S.c[id]||{e:2.5,i:0,d:0};
 if(r===0){c.i=0;c.e=Math.max(1.3,c.e-.2);q.push(id);c.d=Date.now()+6e4}
 else{c.i=r===1?Math.max(1,c.i*1.2):c.i===0?(r===3?3:1):c.i*c.e*(r===3?1.3:1);c.e=Math.max(1.3,c.e+(r===3?.15:r===1?-.15:0));c.d=Date.now()+c.i*day}
 S.c[id]=c;save();shown=false;card()}

function quiz(k,ls,cnt){
 qk=k;const W=poolW(ls),G=ls.flatMap(l=>L[l].g),ng=Math.min(G.length,Math.floor(cnt*.4)),out=[];
 sh(W).slice(0,cnt-ng).forEach(w=>{const rev=Math.random()<.5,o=sh(W.filter(x=>x!==w)).slice(0,3).concat(w);
  out.push({p:rev?w.ru:w.de,t:rev?'Как это по-немецки?':'Что это значит?',o:sh(o).map(x=>rev?x.de:x.ru),a:rev?w.de:w.ru})});
 sh(G).slice(0,ng).forEach(g=>out.push({p:g[0],t:'Вставь пропущенное слово',o:sh(g[2]),a:g[1]}));
 Q=sh(out);n=0;sc=0;if(V.l===null)V={l:'S',s:'q'};
 app.innerHTML=`<button class="back" onclick="render()">‹ Выйти</button><div id="body"></div>`;ask()}
function ask(){
 const B=$('#body');
 if(n>=Q.length){const old=S.q[qk];if(old==null||sc>old){S.q[qk]=sc;save()}
  B.innerHTML=`<h1>Готово</h1><div class="box"><p class="de">${sc} из ${Q.length}</p><p class="sub">${sc>=Q.length*.9?'Schweizer Präzision.':sc>=Q.length*.6?'Хорошо. Ещё круг — и закрепится.':'Бывает. Загляни в слова и вернись.'}</p></div><button class="b main" onclick="restart()">Ещё раз</button><button class="b" onclick="render()">Назад</button>`;return}
 const x=Q[n];
 B.innerHTML=`<div class="bar"><i style="width:${n/Q.length*100}%"></i></div><p class="sub">${x.t}</p><div class="box"><p class="de" style="font-size:26px">${x.p}</p></div>`+x.o.map((o,k)=>`<button class="b" data-k="${k}" onclick="pick(${k})">${o}</button>`).join('')}
let last=null;
function restart(){const m={test:[[0,1,2,3,4,5,6],20]};const l=qk==='test'?m.test:[[+qk.slice(1)],10];quiz(qk,l[0],l[1])}
function pick(k){const x=Q[n];
 document.querySelectorAll('.b[data-k]').forEach(b=>{b.disabled=true;const v=x.o[b.dataset.k];if(v===x.a)b.classList.add('ok');else if(+b.dataset.k===k)b.classList.add('no')});
 if(x.o[k]===x.a)sc++;
 const nx=document.createElement('button');nx.className='b main';nx.textContent='Дальше';nx.onclick=()=>{n++;ask()};$('#body').appendChild(nx);nx.focus()}
home();
</script>
</body>
</html>
