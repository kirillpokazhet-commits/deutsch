<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch A1.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--surf:#fff;--ink:#14213d;--mute:#5b6783;--red:#d52b1e;--blue:#2f6db0;--ok:#1f8a4c;--line:#d5dbe6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--surf:#1a2232;--ink:#eef1f7;--mute:#9aa6bf;--red:#ff5a4d;--blue:#6aa6e8;--ok:#4cc27f;--line:#2c3750;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:30px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:186px;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:14px 4px;cursor:pointer}
nav button.on{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.box{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.de{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0}
.ex{color:var(--mute);margin-top:10px}
.joke{border-left:4px solid var(--red);padding-left:12px;color:var(--mute);margin:12px 0 0}
table{border-collapse:collapse;margin:8px 0}td{padding:4px 18px 4px 0}td:first-child{color:var(--mute)}
b.k{color:var(--red)}
button.b{font:600 16px inherit;font-family:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%;text-align:left;margin-top:8px}
button.b:focus-visible,nav button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.main{background:var(--red);border-color:var(--red);color:#fff;text-align:center}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surf))}
button.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--surf))}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row .b{text-align:center;padding:12px 4px;font-size:14px}
.say{border:0;background:none;font-size:24px;cursor:pointer;color:var(--blue);padding:0 6px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-t="theory" class="on">Теория</button>
<button data-t="cards">Карточки</button>
<button data-t="quiz">Тренировка</button>
</nav>
<script>
const V=[
["Hallo","привет","Hallo, ich bin Anna."],
["Guten Tag","добрый день","Guten Tag, Herr Meier."],
["Guten Morgen","доброе утро","Guten Morgen! Wie geht’s?"],
["Guten Abend","добрый вечер","Guten Abend, Frau Keller."],
["Grüezi","здравствуйте (по-швейцарски)","Grüezi mitenand!"],
["Tschüss","пока","Tschüss, bis morgen!"],
["Auf Wiedersehen","до свидания","Auf Wiedersehen, Frau Keller."],
["Ich heiße …","меня зовут …","Ich heiße Ivan."],
["Wie heißen Sie?","как вас зовут?","Wie heißen Sie, bitte?"],
["Woher kommen Sie?","откуда вы?","Woher kommen Sie?"],
["Ich komme aus …","я родом из …","Ich komme aus Russland."],
["Ich wohne in …","я живу в …","Ich wohne in Uznach."],
["Freut mich","приятно познакомиться","Freut mich, Herr Meier."],
["Wie geht’s?","как дела?","Hallo, wie geht’s?"],
["Gut, danke","хорошо, спасибо","Gut, danke. Und Ihnen?"],
["Danke","спасибо","Danke schön!"],
["Bitte","пожалуйста","Bitte sehr."],
["Entschuldigung","извините","Entschuldigung, wo ist der Bahnhof?"],
["Ja / Nein","да / нет","Ja, das stimmt. Nein, danke."],
["eins, zwei, drei","один, два, три","Eins, zwei, drei – los!"],
["vier, fünf, sechs","четыре, пять, шесть","Ich habe fünf Euro."],
["sieben, acht, neun, zehn","семь, восемь, девять, десять","Zehn Franken, bitte."]
];
const G=[
["Ich ___ Ivan.","heiße",["heiße","heißt","heißen"]],
["Wie ___ Sie?","heißen",["heißen","heiße","heißt"]],
["Ich ___ aus Russland.","komme",["komme","kommst","kommen"]],
["Du ___ in Uznach.","wohnst",["wohnst","wohne","wohnt"]],
["Ich ___ müde.","bin",["bin","bist","ist"]],
["Du ___ nett.","bist",["bist","bin","ist"]],
["Er ___ Lehrer.","ist",["ist","bin","sind"]],
["Wir ___ Anfänger.","sind",["sind","seid","ist"]],
["Woher ___ du?","kommst",["kommst","komme","kommt"]],
["Guten ___, Frau Keller! (вечером)","Abend",["Abend","Morgen","Tag"]]
];
const $=s=>document.querySelector(s),app=$('#app');
let S={};try{S=JSON.parse(localStorage.getItem('de-a1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('de-a1',JSON.stringify(S))}catch(e){}}
S.c=S.c||{};
const day=86400000,sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/…/g,''));u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
window.say=say;

function theory(){app.innerHTML=`
<h1>Deutsch A1.1</h1><p class="sub">Теория без боли. Почти.</p>
<div class="box"><h2>sein — «быть»</h2>
<p>Самый важный глагол. Он неправильный, как и вся жизнь: просто выучи.</p>
<table><tr><td>ich</td><td><b class="k">bin</b></td></tr><tr><td>du</td><td><b class="k">bist</b></td></tr><tr><td>er / sie</td><td><b class="k">ist</b></td></tr><tr><td>wir</td><td><b class="k">sind</b></td></tr><tr><td>ihr</td><td><b class="k">seid</b></td></tr><tr><td>sie / Sie</td><td><b class="k">sind</b></td></tr></table>
<p class="joke">Ich bin müde — универсальная фраза для понедельника.</p></div>
<div class="box"><h2>Глагол — всегда на втором месте</h2>
<p>В обычном предложении и в вопросе с вопросительным словом глагол стоит <b>вторым</b>. Что стоит первым — неважно.</p>
<p><b>Ich</b> <b class="k">wohne</b> in Uznach.<br><b>Wo</b> <b class="k">wohnst</b> du?</p>
<p class="joke">Немецкий глагол — как гость на свадьбе: на втором месте, и никто не спорит.</p></div>
<div class="box"><h2>Ich, du, Sie — как обращаться</h2>
<p><b>du</b> — друзьям, детям, одногруппникам. <b>Sie</b> — незнакомым взрослым, учителю, чиновнику (и пишется с большой буквы). Сомневаешься — говори <b>Sie</b>, за вежливость ещё никого не штрафовали.</p>
<p class="joke">В Швейцарии «Grüezi» вместо «Guten Tag» — и вы уже почти местный.</p></div>`}

function dueList(){const n=Date.now();return V.map((_,i)=>i).filter(i=>!S.c[i]||S.c[i].d<=n)}
let q=[],shown=false;
function cards(){q=sh(dueList()).slice(0,12);shown=false;card()}
function card(){
 if(!q.length){const next=Object.values(S.c).map(x=>x.d).sort((a,b)=>a-b)[0];
  app.innerHTML=`<h1>Карточки</h1><div class="box"><h2>На сегодня всё</h2><p class="sub">${next?'Следующее повторение — '+new Date(next).toLocaleString('ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'Карточек нет'}.</p></div>`;return}
 const i=q[0],w=V[i];
 app.innerHTML=`<h1>Карточки</h1><div class="meta"><span>Осталось: ${q.length}</span><span>Выучено: ${Object.values(S.c).filter(x=>x.i>=7).length} из ${V.length}</span></div>
 <div class="box"><p class="de">${w[0]}<button class="say" aria-label="Озвучить" onclick="say(V[${i}][0])">🔊</button></p>
 ${shown?`<p class="de" style="font-size:22px;margin-top:12px;color:var(--blue)">${w[1]}</p><p class="ex">${w[2]}<button class="say" aria-label="Озвучить пример" onclick="say(V[${i}][2])">🔊</button></p>`:''}</div>
 ${shown?`<div class="row"><button class="b" onclick="rate(0)">Снова</button><button class="b" onclick="rate(1)">Трудно</button><button class="b" onclick="rate(2)">Хорошо</button><button class="b" onclick="rate(3)">Легко</button></div>`
 :`<button class="b main" onclick="shown=true;card()">Показать ответ</button>`}`}
window.rate=function(r){
 const i=q.shift(),c=S.c[i]||{e:2.5,i:0,d:0};
 if(r===0){c.i=0;c.e=Math.max(1.3,c.e-.2);q.push(i);c.d=Date.now()+60000}
 else{c.i=r===1?Math.max(1,c.i*1.2):c.i===0?(r===3?3:1):c.i*c.e*(r===3?1.3:1);c.e=Math.max(1.3,c.e+(r===3?.15:r===1?-.15:0));c.d=Date.now()+c.i*day}
 S.c[i]=c;save();shown=false;card()};

let Q=[],n=0,sc=0;
function mk(){const out=[];
 sh(V.map((_,i)=>i)).slice(0,6).forEach(i=>{const rev=Math.random()<.5,o=sh(V.map((_,k)=>k).filter(k=>k!==i)).slice(0,3).concat(i);
  out.push({p:rev?V[i][1]:V[i][0],t:rev?'Как это по-немецки?':'Что это значит?',o:sh(o).map(k=>V[k][rev?0:1]),a:V[i][rev?0:1]})});
 sh(G).slice(0,4).forEach(g=>out.push({p:g[0],t:'Вставь пропущенное слово',o:sh(g[2]),a:g[1]}));
 return sh(out)}
function quiz(){Q=mk();n=0;sc=0;ask()}
function ask(){
 if(n>=Q.length){app.innerHTML=`<h1>Готово</h1><div class="box"><p class="de">${sc} из ${Q.length}</p><p class="sub">${sc>=Q.length-1?'Отлично, Schweizer Präzision.':sc>=Q.length*.6?'Хорошо. Ещё круг — и закрепится.':'Бывает. Загляни в карточки и вернись.'}</p></div><button class="b main" onclick="quiz()">Ещё раз</button>`;return}
 const x=Q[n];
 app.innerHTML=`<h1>Тренировка</h1><div class="bar"><i style="width:${n/Q.length*100}%"></i></div><p class="sub">${x.t}</p>
 <div class="box"><p class="de" style="font-size:26px">${x.p}</p></div>
 ${x.o.map((o,k)=>`<button class="b" data-k="${k}" onclick="pick(${k})">${o}</button>`).join('')}`}
window.pick=function(k){const x=Q[n];
 document.querySelectorAll('.b[data-k]').forEach(b=>{b.disabled=true;const v=x.o[b.dataset.k];if(v===x.a)b.classList.add('ok');else if(+b.dataset.k===k)b.classList.add('no')});
 if(x.o[k]===x.a)sc++;
 const nx=document.createElement('button');nx.className='b main';nx.textContent='Дальше';nx.onclick=()=>{n++;ask()};app.appendChild(nx);nx.focus()};

const T={theory,cards,quiz};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));T[b.dataset.t]();scrollTo(0,0)});
theory();
</script>
</body>
</html>
